<svg xmlns="http://www.w3.org/2000/svg" viewBox="48 70 675 225" role="img" aria-labelledby="title desc">
  <title id="title">Анимированный перевод денег с карты в кошелёк</title>
  <desc id="desc">Карта слева отправляет монеты через защищённый канал в цифровой кошелёк справа.</desc>
  <style>
    .float { animation: float 3.2s ease-in-out infinite; }
    .wallet { animation: wallet 3.2s ease-in-out infinite; transform-origin: 597px 213px; }
    .signal { animation: signal 2.4s ease-out infinite; transform-origin: 380px 180px; }
    .coin { animation: transfer 2.8s cubic-bezier(.2,.7,.35,1) infinite; opacity: 0; }
    .coin-2 { animation-delay: .7s; }
    .coin-3 { animation-delay: 1.4s; }
    .spark { animation: sparkle 2.8s ease-in-out infinite; transform-origin: center; }
    .spark-2 { animation-delay: .7s; }
    .spark-3 { animation-delay: 1.4s; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes wallet { 0%,20%,100% { transform: scale(1) } 28% { transform: scale(1.045) } 38% { transform: scale(1) } }
    @keyframes signal { 0% { opacity: .15; transform: scale(.7) } 55% { opacity: .8; transform: scale(1) } 100% { opacity: .15; transform: scale(1.15) } }
    @keyframes transfer { 0% { opacity: 0; transform: translate(0,0) scale(.7) } 12% { opacity: 1 } 76% { opacity: 1; transform: translate(245px,0) scale(1) } 92%,100% { opacity: 0; transform: translate(270px,0) scale(.65) } }
    @keyframes sparkle { 0%,100% { opacity: .25; transform: scale(.65) } 50% { opacity: 1; transform: scale(1.12) } }
    @media (prefers-reduced-motion: reduce) { .float,.wallet,.signal,.coin,.spark { animation: none; } .coin { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#2A63F5"/><stop offset="1" stop-color="#7546E8"/></linearGradient>
    <linearGradient id="walletFill" x1="0" x2="1"><stop stop-color="#123C72"/><stop offset="1" stop-color="#1E5A9B"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#163D72" flood-opacity=".15"/></filter>
  </defs>
  <path d="M218 180H536" fill="none" stroke="#AFC7DC" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 10"/>
  <g class="signal"><circle cx="380" cy="180" r="47" fill="none" stroke="#5A87C0" stroke-width="2" opacity=".28"/><circle cx="380" cy="180" r="30" fill="none" stroke="#5A87C0" stroke-width="2" opacity=".45"/></g>
  <g filter="url(#shadow)" class="float">
    <rect x="71" y="102" width="185" height="154" rx="22" fill="url(#card)"/>
    <path d="M71 151h185" stroke="#A7C6FF" stroke-opacity=".55" stroke-width="9"/>
    <rect x="94" y="174" width="42" height="30" rx="7" fill="#F5D474"/>
    <path d="M100 189h30M115 177v24" stroke="#D6A744" stroke-width="2" opacity=".8"/>
    <circle cx="217" cy="220" r="14" fill="#FFF" opacity=".82"/><circle cx="232" cy="220" r="14" fill="#FFDC6A" opacity=".88"/>
  </g>
  <g filter="url(#shadow)" class="wallet">
    <path d="M544 136c0-12 10-22 22-22h97c13 0 23 10 23 23v116c0 14-11 25-25 25H544c-16 0-29-13-29-29v-74c0-16 13-29 29-29h99" fill="url(#walletFill)"/>
    <path d="M544 146h116c13 0 24 11 24 24v83c0 14-11 25-25 25H544c-16 0-29-13-29-29v-74c0-16 13-29 29-29Z" fill="#2469A9"/>
    <path d="M541 164h143" stroke="#78B3E7" stroke-width="3" opacity=".55"/>
    <rect x="631" y="188" width="67" height="44" rx="14" fill="#0C315A"/>
    <circle cx="651" cy="210" r="7" fill="#68D5A4"/><path d="m648 210 3 3 6-7" fill="none" stroke="#0C315A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="coin"><circle cx="238" cy="180" r="17" fill="#FFD45A"/><circle cx="238" cy="180" r="12" fill="none" stroke="#E5AC26" stroke-width="2"/><path d="M241 171c-2-2-8-1-8 3 0 6 10 3 10 9 0 4-6 6-10 3m5-17v20" fill="none" stroke="#C78B12" stroke-width="2" stroke-linecap="round"/></g>
  <g class="coin coin-2"><circle cx="238" cy="180" r="17" fill="#FFD45A"/><circle cx="238" cy="180" r="12" fill="none" stroke="#E5AC26" stroke-width="2"/><path d="M241 171c-2-2-8-1-8 3 0 6 10 3 10 9 0 4-6 6-10 3m5-17v20" fill="none" stroke="#C78B12" stroke-width="2" stroke-linecap="round"/></g>
  <g class="coin coin-3"><circle cx="238" cy="180" r="17" fill="#FFD45A"/><circle cx="238" cy="180" r="12" fill="none" stroke="#E5AC26" stroke-width="2"/><path d="M241 171c-2-2-8-1-8 3 0 6 10 3 10 9 0 4-6 6-10 3m5-17v20" fill="none" stroke="#C78B12" stroke-width="2" stroke-linecap="round"/></g>
  <g class="spark" fill="#31B981"><path d="m699 112 4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><circle cx="680" cy="92" r="4"/></g>
  <g class="spark spark-2" fill="#477CF4"><path d="m290 88 3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></g>
  <g class="spark spark-3" fill="#F4B83F"><circle cx="459" cy="278" r="6"/></g>
</svg>
