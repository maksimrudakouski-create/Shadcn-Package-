<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" role="img" aria-labelledby="title desc">
  <title id="title">Анимированный перевод с карты на телефон</title>
  <desc id="desc">Карта отправляет деньги на мобильный телефон.</desc>
  <style>
    .card { animation: card-pulse 3s ease-in-out infinite; transform-origin: 96px 132px; }
    .phone { animation: phone-pulse 3s ease-in-out infinite; transform-origin: 348px 132px; }
    .path { animation: route 2.6s linear infinite; }
    .coin { animation: send 2.6s cubic-bezier(.2,.7,.35,1) infinite; opacity: 0; }
    .coin-2 { animation-delay: .85s; }
    .coin-3 { animation-delay: 1.7s; }
    .spark { animation: sparkle 2.6s ease-in-out infinite; transform-origin: center; }
    .spark-2 { animation-delay: .85s; }
    @keyframes card-pulse { 0%,100% { transform: translateY(0) rotate(0); } 18% { transform: translateY(2px) rotate(-1deg); } 40% { transform: translateY(-4px) rotate(1deg); } 58% { transform: translateY(0) rotate(0); } }
    @keyframes phone-pulse { 0%,57%,100% { transform: scale(1); } 66% { transform: scale(1.045); } 76% { transform: scale(1); } }
    @keyframes route { 0% { stroke-dashoffset: 36; opacity: .3; } 45% { opacity: .85; } 100% { stroke-dashoffset: 0; opacity: .3; } }
    @keyframes send { 0% { opacity: 0; transform: translate(0,0) scale(.65); } 12% { opacity: 1; } 76% { opacity: 1; transform: translate(173px,0) scale(1); } 92%,100% { opacity: 0; transform: translate(193px,0) scale(.65); } }
    @keyframes sparkle { 0%,100% { opacity:.2; transform:scale(.65); } 50% { opacity:1; transform:scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { .card,.phone,.path,.coin,.spark { animation: none; } .coin { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="card" x1="45" x2="145" y1="77" y2="177" gradientUnits="userSpaceOnUse"><stop stop-color="#8A9099"/><stop offset="1" stop-color="#4B5058"/></linearGradient>
    <linearGradient id="phone" x1="312" x2="387" y1="70" y2="192" gradientUnits="userSpaceOnUse"><stop stop-color="#4D535C"/><stop offset="1" stop-color="#20242A"/></linearGradient>
    <linearGradient id="screen" x1="324" x2="377" y1="87" y2="171" gradientUnits="userSpaceOnUse"><stop stop-color="#F0F2F4"/><stop offset="1" stop-color="#BFC5CB"/></linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#1D2025" flood-opacity=".18"/></filter>
  </defs>
  <path class="path" d="M150 130h145" fill="none" stroke="#9EA5AD" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 10"/>
  <g class="card" filter="url(#shadow)">
    <rect x="40" y="76" width="112" height="108" rx="17" fill="url(#card)"/>
    <path d="M40 113h112" stroke="#D4D8DC" stroke-width="8" stroke-opacity=".48"/>
    <rect x="59" y="133" width="29" height="21" rx="5" fill="#D5D9DE"/>
    <path d="M64 144h19M73.5 136v16" stroke="#8B9199" stroke-width="1.5" opacity=".75"/>
    <circle cx="129" cy="162" r="9" fill="#F4F5F6" opacity=".82"/><circle cx="139" cy="162" r="9" fill="#B8BEC5" opacity=".88"/>
  </g>
  <g class="phone" filter="url(#shadow)">
    <rect x="305" y="63" width="91" height="136" rx="18" fill="url(#phone)"/>
    <rect x="313" y="78" width="75" height="105" rx="11" fill="url(#screen)"/>
    <rect x="336" y="69" width="29" height="4" rx="2" fill="#8F959D"/>
    <circle cx="350.5" cy="190" r="4" fill="#9399A1"/>
    <circle cx="350" cy="125" r="22" fill="#606770"/>
    <path d="m340 125 7 7 14-15" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M326 160h48" stroke="#7C838B" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  </g>
  <g class="coin"><circle cx="143" cy="130" r="13" fill="#D8DCE0"/><circle cx="143" cy="130" r="9" fill="none" stroke="#8B9198" stroke-width="1.7"/><path d="M146 123c-2-2-7-1-7 3 0 5 9 3 9 8 0 4-5 5-9 3m4-17v20" fill="none" stroke="#656B73" stroke-width="1.7" stroke-linecap="round"/></g>
  <g class="coin coin-2"><circle cx="143" cy="130" r="13" fill="#D8DCE0"/><circle cx="143" cy="130" r="9" fill="none" stroke="#8B9198" stroke-width="1.7"/><path d="M146 123c-2-2-7-1-7 3 0 5 9 3 9 8 0 4-5 5-9 3m4-17v20" fill="none" stroke="#656B73" stroke-width="1.7" stroke-linecap="round"/></g>
  <g class="coin coin-3"><circle cx="143" cy="130" r="13" fill="#D8DCE0"/><circle cx="143" cy="130" r="9" fill="none" stroke="#8B9198" stroke-width="1.7"/><path d="M146 123c-2-2-7-1-7 3 0 5 9 3 9 8 0 4-5 5-9 3m4-17v20" fill="none" stroke="#656B73" stroke-width="1.7" stroke-linecap="round"/></g>
  <g class="spark" fill="#9CA2A9"><path d="m176 81 3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></g>
  <g class="spark spark-2" fill="#747A82"><circle cx="284" cy="185" r="5"/></g>
</svg>
