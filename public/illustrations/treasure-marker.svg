    <path d="M360 95c2-11 10-17 20-17s18 6 20 17M363 109v13m34-13-1 13" fill="none" stroke="#858B92" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M376 101c0-4 7-4 7 0v4h4v10h-15v-10h4Z" fill="#C0C5CA" stroke="#464C53" stroke-width="1.8" stroke-linejoin="round"/>
