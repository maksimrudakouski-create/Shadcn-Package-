    <path d="M353 96c1-15 11-24 27-24 15 0 25 9 27 24l-2 26c-9 5-40 5-50 0Z" fill="#D7DBDF" stroke="#464C53" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
