<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 205" role="img" aria-labelledby="title desc">
  <title id="title">Метка сокровища</title>
  <desc id="desc">Пунктирная линия ведёт к крестику. Под ним написано: The treasure is here.</desc>
  <style>
    .route { animation: dash 2.6s linear infinite; }
    .marker { animation: marker 2.6s ease-in-out infinite; transform-origin: 326px 104px; }
    @keyframes dash { to { stroke-dashoffset: -34; } }
    @keyframes marker { 0%,100% { transform: scale(1) rotate(0deg); } 52% { transform: scale(1.11) rotate(4deg); } 70% { transform: scale(.98) rotate(-2deg); } }
    @media (prefers-reduced-motion: reduce) { .route,.marker { animation:none; } }
  </style>
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1D2025" flood-opacity=".18"/></filter>
  </defs>
